<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/CSS/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Quicksand:wght@300..700&display=swap"
        rel="stylesheet">
    <link rel="icon" href="/Images/co-dang-cong-san-viet-nam-vector-removebg-preview.png">
</head>

<body>

    <div class="container">

        <!-- BÊN TRÁI -->

        <div class="left">

            <!-- ICON ĐẢNG -->
            <img src="/Images/co-dang-cong-san-viet-nam-vector-removebg-preview.png" class="logo">

            <h2>ĐẢNG BỘ XÃ KIẾN THỤY</h2>

            <h1>
                HỆ THỐNG ĐIỀU HÀNH ĐẢNG BỘ
            </h1>

            <p>
                Bảo mật - Chính xác - Kịp thời - Hiệu quả
            </p>

        </div>

        <!-- BÊN PHẢI -->

        <div class="right">

            <div class="login-box">

                <h2>ĐĂNG NHẬP HỆ THỐNG</h2>

                <p class="desc">
                    Chấm điểm đánh giá chất lượng sinh hoạt chi bộ
                </p>

                <label class="label">
                    Tên đăng nhập
                </label>

                <div class="input-box">

                    <input type="text" id="user" placeholder="Nhập tên đăng nhập">

                </div>

                <label class="label">
                    Mật khẩu
                </label>

                <div class="input-box">

                    <input type="password" id="pass" placeholder="Nhập mật khẩu">

                    <span class="eye" id="eye">
                        <i class="fa-solid fa-eye"></i>
                    </span>
                </div>

                <button onclick="dangNhap()">
                    Đăng nhập
                </button>

                <hr>

                <div class="footer">
                    Hỗ trợ: Ngô Thị Thư - SDT: 0982596042
                </div>

            </div>

        </div>

    </div>
    <script src="/JS/login.js"></script>
</body>

</html>
